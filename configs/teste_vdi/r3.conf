# Teste da VDI: triangulo da apresentacao em 2 VMs.
#   VM do William: R1 (porta 6000) e R2 (porta 6002)   |   VM do Gustavo: R3 (porta 6000)
#   Arestas: R1-R2=1, R2-R3=2, R1-R3=5 (as mesmas de configs/grupo)
# ANTES DE USAR: troque IP_R1 pelo IP da VM do William.
# Uso: py router.py configs/teste_vdi/r3.conf

endereco 10.6.3.1
porta 6000

# vizinho <IP real> <porta UDP> <custo>
vizinho IP_R1 6000 5    # R1 (William)
vizinho IP_R1 6002 2    # R2 (na VM do William, porta 6002)
