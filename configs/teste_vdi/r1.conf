# Teste da VDI (docs/TESTE_VDI.md): triangulo da apresentacao em 2 VMs.
#   VM do William: R1 (porta 6000) e R2 (porta 6002)   |   VM do Gustavo: R3 (porta 6000)
#   Arestas: R1-R2=1, R2-R3=2, R1-R3=5 (as mesmas de configs/grupo)
# ANTES DE USAR: troque IP_R1 pelo IP da VM do William e IP_R3 pelo IP da VM do Gustavo.
# Uso: py router.py configs/teste_vdi/r1.conf

endereco 10.6.1.1
porta 6000

# vizinho <IP real> <porta UDP> <custo>
vizinho IP_R1 6002 1    # R2 (na mesma VM do William, porta 6002)
vizinho IP_R3 6000 5    # R3 (Gustavo)
